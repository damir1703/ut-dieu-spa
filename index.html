.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;padding:0 0 96px;color:#fff;overflow:hidden}

.hero h1{font-size:clamp(46px,12vw,92px);font-weight:600;margin:14px 0 16px;letter-spacing:-.01em}
.hero h1 em{font-style:italic;color:#f0cfa8}
.hero p{max-width:44ch;opacity:.9;margin-bottom:26px}
.hero-btns{display:flex;flex-wrap:wrap;gap:12px}
.scroll-hint{position:absolute;left:50%;bottom:26px;z-index:1;width:1px;height:44px;background:rgba(255,255,255,.35);overflow:hidden}

.map-grid{display:grid;gap:26px;margin-top:28px}

.figure{position:relative;background:radial-gradient(60% 50% at 50% 40%,#fff8ee,#ecdcc6);border-radius:32px;padding:22px 10px 14px}

.z{color:#d9b998;cursor:pointer;transition:color .35s,transform .35s;transform-box:fill-box;transform-origin:center}
.z .f{fill:currentColor}.z .l{fill:none;stroke:currentColor;stroke-linecap:round}
.z:hover{color:#c99a72}
.z.on{color:var(--acc);filter:drop-shadow(0 6px 14px rgba(168,85,47,.45))}
.dot{fill:#fff;opacity:.9;pointer-events:none;animation:pulse 2.4s infinite;transform-box:fill-box;transform-origin:center}

.zchips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}

.panel h3{font-size:30px;margin-bottom:4px}
.hint{font-size:13px;color:var(--muted);margin-bottom:8px}
.empty{display:grid;place-items:center;min-height:170px;text-align:center;color:var(--muted);font-family:var(--fd);font-size:24px;font-style:italic}

.svc:first-of-type{border-top:0}
.svc-n{font-weight:700;margin-bottom:10px}
.svc-c{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}

.chip{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:9px 9px;border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--line);background:#fff;text-align:left;transition:background .25s,color .25s,transform .2s,box-shadow .25s}

.chip:active{transform:scale(.95)}
.chip b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.chip span{font-weight:700;font-size:14px;white-space:nowrap}
.chip i{font-style:normal;font-size:12px;color:var(--muted)}
.chip.on{background:var(--green);color:#fff;box-shadow:none}
.chip.on b,.chip.on i{color:rgba(255,255,255,.8)}

.tabs{display:flex;gap:8px;overflow-x:auto;margin:24px -20px 14px;padding:4px 20px;scrollbar-width:none;position:sticky;top:58px;z-index:5;background:linear-gradient(var(--bg) 80%,transparent)}

.tabs button.on{background:var(--ink);color:var(--bg);box-shadow:none}
.note{font-size:12px;color:var(--muted);margin-top:16px}

.gal{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 20px 20px;margin-top:22px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:none;width:min(72vw,300px);aspect-ratio:3/4;object-fit:cover;border-radius:24px;scroll-snap-align:center;cursor:zoom-in;transition:transform .5s}

body.has-cart .cart{transform:none}

.cart-sum{flex:1;text-align:left;padding:2px 6px;min-width:0}

const byId = Object.fromEntries(SERVICES.map(s=>[s.id,s]));
const cart = new Map(); let zone = null, cat = 'body';
const L = () => ['ru','en','vi','ko','zh'].indexOf(UD.lang);
const $ = (s) => document.querySelector(s);

function row(s, i){
  const chips = s.d.map((d,j)=>{
    const k = s.id+':'+d, price = s.max ? UD.fmt(s.p[j]).replace(' ₫','')+' – '+UD.fmt(s.max) : UD.fmt(s.p[j]);
    return `<button class="chip${cart.has(k)?' on':''}" data-k="${k}">${d?`<b>${d} ${UD.t('min')}</b>`:'<b>+</b>'}<span>${price}</span><i>${UD.approx(s.p[j])}</i></button>`;
  }).join('');
  return `<div class="svc" style="animation-delay:${i*.05}s"><div class="svc-n">${s.n[L()]}</div><div class="svc-c">${chips}</div></div>`;
}
function renderPanel(){
  $('#panel').innerHTML = zone
    ? `<h3>${UD.t('z_'+zone)}</h3><div class="hint">${UD.t('tap_hint')}</div>` + ZONES[zone].map((id,i)=>row(byId[id],i)).join('')
    : `<div class="empty">${UD.t('map_empty')}</div>`;
  document.querySelectorAll('.z').forEach(z=>z.classList.toggle('on', z.dataset.z===zone));
  $('#zchips').innerHTML = Object.keys(ZONES).map(z=>`<button data-z="${z}" class="${z===zone?'on':''}">${UD.t('z_'+z)}</button>`).join('');
}
function renderMenu(){
  $('#tabs').innerHTML = CATS.map(c=>`<button data-c="${c}" class="${c===cat?'on':''}">${UD.t('c_'+c)}</button>`).join('');
  $('#list').innerHTML = SERVICES.filter(s=>s.c===cat).map(row).join('');
}
function renderCart(){
  let sum=0, mins=0, plus=false, html='', msg="Hello! I'd like to book at Út Điệu Spa:\n";
  cart.forEach((v,k)=>{
    const [id,d]=k.split(':'), s=byId[id], p=s.p[s.d.indexOf(+d)];
    sum+=p; mins+=+d; if(s.max) plus=true;
    html+=`<div><span>${s.n[L()]}${+d?` · ${d} ${UD.t('min')}`:''}</span><span>${UD.fmt(p)}${s.max?'+':''} <button data-rm="${k}" aria-label="remove">×</button></span></div>`;
    msg+=`• ${s.n[1]}${+d?` — ${d} min`:''} — ${UD.fmt(p)}${s.max?'+':''}\n`;
  });
  msg+=`Total: ${UD.fmt(sum)}${plus?'+':''}\nPreferred day and time: `;
  document.body.classList.toggle('has-cart', cart.size>0);
  if(!cart.size) $('#cart').classList.remove('open');
  $('#cartList').innerHTML = html;
  $('#cartSum').innerHTML = `<small>${UD.t('cart_h')} · ${cart.size}${mins?` · ${mins} ${UD.t('min')}`:''} ▴</small><strong>${UD.fmt(sum)}${plus?'+':''}</strong>`;
  $('#cartGo').innerHTML = UD.WA_ICON+`<span>${UD.t('book')}</span>`;
  $('#cartGo').href = UD.wa(msg);
}
function renderAll(){ renderPanel(); renderMenu(); renderCart(); }
function pickZone(z){ zone = z; renderPanel(); if(innerWidth<820) $('#panel').scrollIntoView({behavior:'smooth',block:'start'}); }

document.addEventListener('click',(e)=>{
  const chip=e.target.closest('.chip'), z=e.target.closest('[data-z]'), tab=e.target.closest('[data-c]'), rm=e.target.closest('[data-rm]');
  if(chip){ const k=chip.dataset.k; cart.has(k)?cart.delete(k):cart.set(k,1);
    document.querySelectorAll(`.chip[data-k="${k}"]`).forEach(c=>c.classList.toggle('on',cart.has(k))); renderCart(); }
  else if(rm){ cart.delete(rm.dataset.rm); renderAll(); }
  else if(z) pickZone(z.dataset.z);
  else if(tab){ cat=tab.dataset.c; renderMenu(); }
  else if(e.target.closest('#cartSum')) $('#cart').classList.toggle('open');
  else if(e.target.closest('.gal img')){ const b=document.createElement('div'); b.className='lb'; b.innerHTML=`<img src="${e.target.src}" alt="">`; b.onclick=()=>b.remove(); document.body.appendChild(b); }
});
$('#gal').innerHTML = [17,9,12,13,16,10,15,8,11].map(n=>`<img class="rv" loading="lazy" src="assets/img/p${n}.jpg" alt="Út Điệu Spa">`).join('');
</script>
