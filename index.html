<style>
:root{--bg:#f6efe6;--ink:#3b2418;--muted:#8a7163;--acc:#a8552f;--acc-ink:#fff;--card:#fffaf3;--line:rgba(74,44,29,.12);--hdr:rgba(246,239,230,.86);
--gate:radial-gradient(120% 90% at 50% 0%,#5a3423,#2a1810);--gate-ink:#f6efe6;--gate-card:rgba(255,255,255,.1);
--fd:"Cormorant Garamond",Georgia,serif;--fb:Manrope,system-ui,sans-serif;--green:#2f6b46}
.hdr:not(.solid){color:#fff}
/* hero */
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;padding:0 0 96px;color:#fff;overflow:hidden}
.hero-bg{position:absolute;inset:-6% 0;width:100%;height:112%;object-fit:cover;animation:kb 22s ease-in-out infinite alternate;will-change:transform}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.14) translateY(-2%)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(42,24,16,.45) 0%,rgba(42,24,16,.3) 30%,rgba(42,24,16,.8) 58%,rgba(42,24,16,.95) 100%)}
.hero .w{position:relative;z-index:1}
.hero .kick{color:#f0cfa8}
.hero h1{font-size:clamp(46px,12vw,92px);font-weight:600;margin:14px 0 16px;letter-spacing:-.01em}
.hero h1 em{font-style:italic;color:#f0cfa8}
.hero p{max-width:44ch;opacity:.9;margin-bottom:26px}
.hero-btns{display:flex;flex-wrap:wrap;gap:12px}
.scroll-hint{position:absolute;left:50%;bottom:26px;z-index:1;width:1px;height:44px;background:rgba(255,255,255,.35);overflow:hidden}
.scroll-hint::after{content:"";position:absolute;inset:0;background:#fff;animation:drop 2s infinite}
@keyframes drop{from{transform:translateY(-100%)}to{transform:translateY(100%)}}
/* body map */
.map-grid{display:grid;gap:22px;margin-top:28px}
.map-grid>*{min-width:0}
@media(min-width:820px){.map-grid{grid-template-columns:360px 1fr;align-items:start}}
.figure{position:relative;background:radial-gradient(70% 55% at 50% 42%,#fffaf2 0%,#f1e2cd 55%,#e6d0b3 100%);border-radius:32px;padding:20px 10px 16px;overflow:hidden}
.figure::before,.figure::after{content:"";position:absolute;left:50%;top:44%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;border:1px solid rgba(168,85,47,.18);animation:ring 6s ease-out infinite}
.figure::after{animation-delay:3s}
@keyframes ring{from{transform:scale(.45);opacity:1}to{transform:scale(1.5);opacity:0}}
.figure svg{position:relative;z-index:1;height:min(52svh,480px);margin:0 auto;overflow:visible;filter:drop-shadow(0 18px 22px rgba(120,70,40,.18))}
.z{cursor:pointer}
.z path,.z ellipse{fill:url(#skin);stroke:#fff8ee;stroke-width:2.5;stroke-linejoin:round;transition:fill .35s,filter .35s}
.z:hover path,.z:hover ellipse{fill:#dcb48e}
.z.on path,.z.on ellipse{fill:url(#skinOn);filter:drop-shadow(0 0 10px rgba(168,85,47,.55))}
.dot{fill:#fff;pointer-events:none;animation:pulse 2.4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(2);opacity:.2}}
.zchips{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.zchips button{padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.75);font-size:13px;font-weight:600;transition:.25s}
.zchips button.on{background:var(--acc);color:#fff}
.panel{background:var(--card);border-radius:28px;padding:22px 18px;box-shadow:0 0 0 1px var(--line);min-height:220px;scroll-margin-top:70px}
.panel h3{font-size:30px;margin-bottom:4px}
.hint{font-size:13px;color:var(--muted);margin-bottom:14px}
.empty{display:grid;place-items:center;min-height:170px;text-align:center;color:var(--muted);font-family:var(--fd);font-size:24px;font-style:italic}
/* duration switch + price list */
.seg{display:inline-flex;gap:2px;padding:4px;border-radius:99px;background:rgba(74,44,29,.07);margin-bottom:6px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{flex:none;padding:8px 14px;border-radius:99px;font-size:13px;font-weight:700;color:var(--muted);transition:.25s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px -2px rgba(74,44,29,.25)}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:14px 0;border-bottom:1px solid var(--line);text-align:left;animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
.rows .row:last-child{border-bottom:0}
.rn{flex:1 1 0;min-width:0;font-weight:600;line-height:1.3}
.rp{flex:none;text-align:right;line-height:1.2}
.rp b{display:block;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.rp i{font-style:normal;font-size:12px;color:var(--muted)}
.add{flex:none;width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;font-size:18px;line-height:1;color:var(--acc);transition:.25s cubic-bezier(.3,1.5,.5,1)}
.add::before{content:"+"}
.row.on .add{background:var(--green);color:#fff;box-shadow:none;transform:scale(1.1)}
.row.on .add::before{content:"✓";font-size:15px}
.row.on .rn{color:var(--green)}
.row.off{opacity:.38}
.row.off .add{visibility:hidden}
/* category cards */
.jump{display:flex;gap:8px;overflow-x:auto;margin:22px -20px 18px;padding:2px 20px;scrollbar-width:none}
.jump::-webkit-scrollbar,.seg::-webkit-scrollbar{display:none}
.jump a{flex:none;padding:10px 18px;border-radius:99px;font-weight:700;font-size:14px;box-shadow:inset 0 0 0 1.5px var(--line)}
.cards{display:grid;gap:18px}
@media(min-width:820px){.cards{grid-template-columns:1fr 1fr;align-items:start}}
.mcard{background:var(--card);border-radius:28px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 24px 40px -34px rgba(74,44,29,.5);scroll-margin-top:70px}
.mphoto{position:relative;aspect-ratio:16/10;overflow:hidden}
.mphoto img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.mcard:hover .mphoto img{transform:scale(1.06)}
.mphoto::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(42,24,16,0) 40%,rgba(42,24,16,.78))}
.mphoto h3{position:absolute;left:18px;bottom:14px;z-index:1;color:#fff;font-size:34px;font-weight:600}
.mbody{padding:16px 18px 8px}
.note{font-size:12px;color:var(--muted);margin-top:16px}
/* gallery */
.gal{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 20px 20px;margin-top:22px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:none;width:min(72vw,300px);aspect-ratio:3/4;object-fit:cover;border-radius:24px;scroll-snap-align:center;cursor:zoom-in;transition:transform .5s}
.gal img:nth-child(even){margin-top:26px}
.lb{position:fixed;inset:0;z-index:90;background:rgba(20,10,5,.94);display:grid;place-items:center;padding:16px;animation:fade .3s}
.lb img{max-height:92svh;border-radius:16px}
@keyframes fade{from{opacity:0}}
/* location */
.loc{display:grid;gap:22px}
@media(min-width:820px){.loc{grid-template-columns:1fr 1fr;align-items:center}}
.loc-img{border-radius:28px;aspect-ratio:4/3;object-fit:cover;width:100%}
.loc-rows{margin:18px 0 22px;display:grid;gap:8px;font-weight:600}
.loc-rows a{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
/* cart */
.cart{position:fixed;left:10px;right:10px;bottom:10px;z-index:50;background:#2a1810;color:#f6efe6;border-radius:24px;padding:12px;transform:translateY(140%);transition:transform .5s cubic-bezier(.2,.8,.2,1);box-shadow:0 20px 50px -15px rgba(0,0,0,.6);max-width:560px;margin:0 auto}
body.has-cart .cart{transform:none}
.cart-top{display:flex;align-items:center;gap:10px}
.cart-sum{flex:1;text-align:left;padding:2px 6px;min-width:0}
.cart-sum small{display:block;font-size:12px;opacity:.7}
.cart-sum strong{font-size:17px;white-space:nowrap}
.cart .btn{padding:13px 18px;font-size:15px}
.cart-list{max-height:0;overflow:hidden;transition:max-height .4s;font-size:14px}
.cart.open .cart-list{max-height:40svh;overflow:auto}
.cart-list div{display:flex;justify-content:space-between;gap:10px;padding:9px 6px;border-bottom:1px solid rgba(255,255,255,.1)}
.cart-list button{opacity:.6;padding:0 6px;font-size:18px}

</style>

const byId = Object.fromEntries(SERVICES.map(s=>[s.id,s]));
const cart = new Map(), dsel = {}; let zone = null;
const $ = (s) => document.querySelector(s);
const listFor = (key) => key==='zone' ? (zone?ZONES[zone].map(id=>byId[id]):[]) : SERVICES.filter(s=>s.c===key);

function row(s, d, i){
  const fixed = !s.d[0], j = fixed ? 0 : s.d.indexOf(d), name = UD.pick(s.n);
  if(j<0) return `<div class="row off" style="animation-delay:${i*.04}s"><span class="rn">${name}</span><span class="rp"><b>—</b></span><span class="add"></span></div>`;
  const k = s.id+':'+(fixed?0:d), p = s.p[j], price = s.max ? UD.fmt(p).replace(' ₫','')+' – '+UD.fmt(s.max) : UD.fmt(p);
  return `<button class="row${cart.has(k)?' on':''}" data-k="${k}" style="animation-delay:${i*.04}s"><span class="rn">${name}</span><span class="rp"><b>${price}</b><i>${UD.approx(p)}</i></span><span class="add"></span></button>`;
}
function block(key){
  const list = listFor(key), ds = [...new Set(list.flatMap(s=>s.d))].filter(Boolean).sort((a,b)=>a-b);
  if(!ds.includes(dsel[key])) dsel[key] = ds.includes(60) ? 60 : ds[0];
  const d = dsel[key];
  const seg = ds.length>1 ? `<div class="seg">`+ds.map(x=>`<button data-d="${x}" class="${x===d?'on':''}">${x} ${UD.t('min')}</button>`).join('')+'</div>' : '';
  return seg+'<div class="rows">'+list.map((s,i)=>row(s,d,i)).join('')+'</div>';
}
function renderPanel(){
  $('#panel').innerHTML = zone
    ? `<h3>${UD.t('z_'+zone)}</h3><div class="hint">${UD.t('tap_hint')}</div><div data-key="zone">${block('zone')}</div>`
    : `<div class="empty">${UD.t('map_empty')}</div>`;
  document.querySelectorAll('.z').forEach(z=>z.classList.toggle('on', z.dataset.z===zone));
  $('#zchips').innerHTML = Object.keys(ZONES).map(z=>`<button data-z="${z}" class="${z===zone?'on':''}">${UD.t('z_'+z)}</button>`).join('');
}
function renderMenu(){
  $('#jump').innerHTML = CATS.map(c=>`<a href="#cat-${c}">${UD.t('c_'+c)}</a>`).join('');
  $('#cards').innerHTML = CATS.map(c=>`<article class="mcard rv" id="cat-${c}"><div class="mphoto"><img loading="lazy" src="${CAT_IMG[c]}" alt=""><h3>${UD.t('c_'+c)}</h3></div><div class="mbody" data-key="${c}">${block(c)}</div></article>`).join('');
  UD.observe();
}
function renderCart(){
  let sum=0, mins=0, plus=false, html='', msg="Hello! I'd like to book at Út Điệu Spa:\n";
  cart.forEach((v,k)=>{
    const [id,d]=k.split(':'), s=byId[id], p=s.p[+d?s.d.indexOf(+d):0];
    sum+=p; mins+=+d; if(s.max) plus=true;
    html+=`<div><span>${UD.pick(s.n)}${+d?` · ${d} ${UD.t('min')}`:''}</span><span>${UD.fmt(p)}${s.max?'+':''} <button data-rm="${k}" aria-label="remove">×</button></span></div>`;
    msg+=`• ${s.n[1]}${+d?` — ${d} min`:''} — ${UD.fmt(p)}${s.max?'+':''}\n`;
  });
  msg+=`Total: ${UD.fmt(sum)}${plus?'+':''}\nPreferred day and time: `;
  document.body.classList.toggle('has-cart', cart.size>0);
  if(!cart.size) $('#cart').classList.remove('open');
  $('#cartList').innerHTML = html;
  $('#cartSum').innerHTML = `<small>${UD.t('cart_h')} · ${cart.size}${mins?` · ${mins} ${UD.t('min')}`:''} ▴</small><strong>${UD.fmt(sum)}${plus?'+':''}</strong>`;
  $('#cartGo').innerHTML = UD.WA_ICON+`<span>${UD.t('book')}</span>`;
  $('#cartGo').href = UD.wa(msg);
}
function renderAll(){ renderPanel(); renderMenu(); renderCart(); }
function pickZone(z){ zone = z; dsel.zone = 0; renderPanel(); if(innerWidth<820) $('#panel').scrollIntoView({behavior:'smooth',block:'start'}); }

document.addEventListener('click',(e)=>{
  const r=e.target.closest('.row[data-k]'), sg=e.target.closest('.seg button'), z=e.target.closest('[data-z]'), rm=e.target.closest('[data-rm]');
  if(r){ const k=r.dataset.k; cart.has(k)?cart.delete(k):cart.set(k,1);
    document.querySelectorAll(`.row[data-k="${k}"]`).forEach(c=>c.classList.toggle('on',cart.has(k))); renderCart(); }
  else if(sg){ const box=sg.closest('[data-key]'); dsel[box.dataset.key]=+sg.dataset.d; box.innerHTML=block(box.dataset.key); }
  else if(rm){ cart.delete(rm.dataset.rm); renderPanel(); document.querySelectorAll('.mbody').forEach(b=>b.innerHTML=block(b.dataset.key)); renderCart(); }
  else if(z) pickZone(z.dataset.z);
  else if(e.target.closest('#cartSum')) $('#cart').classList.toggle('open');
  else if(e.target.closest('.gal img')){ const b=document.createElement('div'); b.className='lb'; b.innerHTML=`<img src="${e.target.src}" alt="">`; b.onclick=()=>b.remove(); document.body.appendChild(b); }
});
