.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;padding:0 0 96px;color:#fff;overflow:hidden}

.figure{position:relative;background:radial-gradient(70% 55% at 50% 42%,#fffaf2 0%,#f1e2cd 55%,#e6d0b3 100%);border-radius:32px;padding:20px 10px 16px;overflow:hidden}
.figure::before,.figure::after{content:"";position:absolute;left:50%;top:44%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;border:1px solid rgba(168,85,47,.18);animation:ring 6s ease-out infinite}
.figure::after{animation-delay:3s}
@keyframes ring{from{transform:scale(.45);opacity:1}to{transform:scale(1.5);opacity:0}}
.figure svg{position:relative;z-index:1;height:min(52svh,480px);margin:0 auto;overflow:visible;filter:drop-shadow(0 18px 22px rgba(120,70,40,.18))}
.z{cursor:pointer;-webkit-tap-highlight-color:transparent}
.z .h,.z:hover .h,.z.on .h{fill:transparent;stroke:none;filter:none}
.z path,.z ellipse{fill:url(#skin);stroke:#fff8ee;stroke-width:2.5;stroke-linejoin:round;transition:fill .35s,filter .35s}
.z:hover path,.z:hover ellipse{fill:#dcb48e}
.z.on path,.z.on ellipse{fill:url(#skinOn);filter:drop-shadow(0 0 10px rgba(168,85,47,.55))}
.dot{fill:#fff;pointer-events:none;animation:pulse 2.4s infinite;transform-box:fill-box;transform-origin:center}

.zchips{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.zchips button{padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.75);font-size:13px;font-weight:600;transition:.25s}
.zchips button.on{background:var(--acc);color:#fff}
.panel{background:var(--card);border-radius:28px;padding:22px 18px;box-shadow:0 0 0 1px var(--line);min-height:220px;scroll-margin-top:70px}
.panel h3{font-size:30px;margin-bottom:4px}
.hint{font-size:13px;color:var(--muted);margin-bottom:14px}
.empty{display:grid;place-items:center;min-height:170px;text-align:center;color:var(--muted);font-family:var(--fd);font-size:24px;font-style:italic}

.rp{flex:none;text-align:right;line-height:1.2}

.add{flex:none;width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;font-size:18px;line-height:1;color:var(--acc);transition:.25s cubic-bezier(.3,1.5,.5,1)}
.add::before{content:"+"}
.row.on .add{background:var(--green);color:#fff;box-shadow:none;transform:scale(1.1)}
.row.on .add::before{content:"✓";font-size:15px}
.row.on .rn{color:var(--green)}
.row.off{opacity:.38}
.row.off .add{visibility:hidden}
.see{flex-basis:100%;text-align:center;margin-top:6px;padding:12px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;animation:rise .4s both}

.z{transform-box:fill-box;transform-origin:center}
.z.on{animation:zpop .45s cubic-bezier(.3,1.5,.5,1)}

.more{display:inline-block;margin-top:14px;font-weight:700;font-size:14px;color:var(--acc)}
.row.hit{margin:0 -18px;padding-left:18px;padding-right:18px;width:calc(100% + 36px);background:linear-gradient(90deg,rgba(168,85,47,.11),rgba(168,85,47,0) 75%)}

.cart{position:fixed;left:10px;right:10px;bottom:10px;z-index:50;background:#2a1810;color:#f6efe6;border-radius:24px;padding:12px;transform:translateY(140%);transition:transform .5s cubic-bezier(.2,.8,.2,1);box-shadow:0 20px 50px -15px rgba(0,0,0,.6);max-width:560px;margin:0 auto}

const byId = Object.fromEntries(SERVICES.map(s=>[s.id,s]));
/* Хиты — по упоминаниям в отзывах Google: top = «выбор гостей», pop = «часто берут» */
const HITS = {deep:'top', foot:'pop', aloe:'pop', hneck:'pop'};
const cart = new Map(), dsel = {}, zones = new Set();
const $ = (s) => document.querySelector(s);
const hitFirst = (a,b) => (HITS[b.id]?1:0)-(HITS[a.id]?1:0);
/* до 4 процедур под выбранные зоны: сначала те, что подходят сразу к нескольким зонам, затем хиты */
function zoneList(){
  const sc = {};
  zones.forEach(z=>ZONES[z].forEach((id,i)=>{ const o = sc[id] || (sc[id]={n:0,i:99}); o.n++; o.i=Math.min(o.i,i); }));
  return Object.keys(sc).sort((a,b)=>(sc[b].n-sc[a].n) || hitFirst(byId[a],byId[b]) || (sc[a].i-sc[b].i)).slice(0,4).map(id=>byId[id]);
}
const listFor = (key) => key==='zone' ? zoneList() : SERVICES.filter(s=>s.c===key).sort(hitFirst);

function row(s, d, i, withD){
  const fixed = !s.d[0], j = fixed ? 0 : s.d.indexOf(d), h = HITS[s.id];
  const name = UD.pick(s.n) + (withD&&!fixed ? `<em class="rd">${d} ${UD.t('min')}</em>` : '') + (h ? `<small class="badge ${h}">★ ${UD.t('hit_'+h)}</small>` : '');
  if(j<0) return `<div class="row off" style="animation-delay:${i*.04}s"><span class="rn">${name}</span><span class="rp"><b>—</b></span><span class="add"></span></div>`;
  const k = s.id+':'+(fixed?0:d), p = s.p[j], price = s.max ? UD.fmt(p).replace(' ₫','')+' – '+UD.fmt(s.max) : UD.fmt(p);
  return `<button class="row${h?' hit':''}${cart.has(k)?' on':''}" data-k="${k}" style="animation-delay:${i*.04}s"><span class="rn">${name}</span><span class="rp"><b>${price}</b><i>${UD.approx(p)}</i></span><span class="add"></span></button>`;
}
function block(key){
  const list = listFor(key), ds = [...new Set(list.flatMap(s=>s.d))].filter(Boolean).sort((a,b)=>a-b);
  if(!ds.includes(dsel[key])) dsel[key] = ds.includes(60) ? 60 : ds[0];
  const d = dsel[key];
  const seg = ds.length>1 ? `<div class="seg">`+ds.map(x=>`<button data-d="${x}" class="${x===d?'on':''}">${x} ${UD.t('min')}</button>`).join('')+'</div>' : '';
  return seg+'<div class="rows">'+list.map((s,i)=>row(s,d,i)).join('')+'</div>';
}
function renderPanel(){
  const zs = [...zones];
  $('#panel').innerHTML = zs.length
    ? `<h3>${UD.t('q_res')}</h3><div class="hint">${zs.map(z=>UD.t('z_'+z)).join(' · ')}</div><div data-key="zone">${block('zone')}</div><a class="more" href="#menu">${UD.t('menu_h')} ↓</a>`
    : `<div class="empty">${UD.t('map_empty')}</div>`;
  document.querySelectorAll('.z').forEach(z=>z.classList.toggle('on', zones.has(z.dataset.z)));
  $('#zchips').innerHTML = Object.keys(ZONES).map(z=>`<button data-z="${z}" class="${zones.has(z)?'on':''}">${UD.t('z_'+z)}</button>`).join('') + (zs.length ? `<a class="see" href="#panel">${UD.t('see')}</a>` : '');
}
/* подбор в три вопроса: цель → время → нажим */
const QUIZ = {
 relax:[['relax','aloe'],['herbal','stone'],['deep','thai']],
 tension:[['neck','herbal'],['stone','neck'],['deep','thai']],
 feet:[['foot','fscrubm'],['foot','fcare'],['foot','thai']],
 skin:[['sun','aloe'],['sun','aloe'],['scrub','aloe']],
 head:[['hrelax','facial'],['hneck','hface'],['hneck','neck']],

const GOALS = [['relax','🌿'],['tension','💆'],['feet','🦶'],['skin','☀️'],['head','💧']], PRESS = ['soft','mid','hard'];
let qa = [];
function renderQuiz(){
  const st = qa.length, dots = '<div class="qdots">'+[0,1,2].map(i=>`<i class="${i<st?'done':i===st?'cur':''}"></i>`).join('')+'</div>';
  let h;
  if(st===0) h = `<h3>${UD.t('q1')}</h3><div class="qopts">`+GOALS.map(([g,e],i)=>`<button data-q="${g}" style="animation-delay:${i*.05}s"><span>${e}</span>${UD.t('g_'+g)}</button>`).join('')+'</div>';
  else if(st===1) h = `<h3>${UD.t('q2')}</h3><div class="qopts three">`+[30,60,90].map((m,i)=>`<button data-q="${m}" style="animation-delay:${i*.05}s"><b>${m}${m===90?'+':''}</b>${UD.t('min')}</button>`).join('')+'</div>';
  else if(st===2) h = `<h3>${UD.t('q3')}</h3><div class="qopts three">`+PRESS.map((p,i)=>`<button data-q="${i}" style="animation-delay:${i*.05}s"><b>${'●'.repeat(i+1)}</b>${UD.t('p_'+p)}</button>`).join('')+'</div>';
  else { const T = +qa[1];
    h = `<h3>${UD.t('q_res')}</h3><div class="hint">${UD.t('tap_hint')}</div><div class="rows">`+QUIZ[qa[0]][+qa[2]].map((id,i)=>{ const s=byId[id]; return row(s, s.d.reduce((b,x)=>Math.abs(x-T)<Math.abs(b-T)?x:b), i, true); }).join('')+`</div><button class="more" data-q="reset">↺ ${UD.t('q_again')}</button>`; }
  $('#quizBox').innerHTML = dots + h;
}
/* готовые наборы: цена = сумма входящих процедур */
const SETS = [{k:'s1',e:'✈️',it:['foot:60','neck:30']},{k:'s2',e:'🏖️',it:['sun:60','hrelax:45']},{k:'s3',e:'✨',it:['deep:90','foot:30','facial:30']}];
const priceOf = (k) => { const [id,d]=k.split(':'), s=byId[id]; return s.p[+d?s.d.indexOf(+d):0]; };
function renderSets(){
  $('#setsBox').innerHTML = SETS.map(st=>{
    const sum = st.it.reduce((a,k)=>a+priceOf(k),0), mins = st.it.reduce((a,k)=>a+ +k.split(':')[1],0), on = st.it.every(k=>cart.has(k));
    return `<article class="setc${on?' on':''}"><div class="se">${st.e}</div><h3>${UD.t(st.k)}</h3><ul>`+st.it.map(k=>{ const [id,d]=k.split(':'); return `<li>${UD.pick(byId[id].n)} <span>${d} ${UD.t('min')}</span></li>`; }).join('')+`</ul><div class="sp"><b>${UD.fmt(sum)}</b><i>${[mins+' '+UD.t('min'), UD.approx(sum)].filter(Boolean).join(' · ')}</i></div><button class="btn" data-set="${st.k}">${UD.t(on?'set_on':'set_add')}</button></article>`;
  }).join('');

function renderMenu(){
  $('#jump').innerHTML = CATS.map(c=>`<a href="#cat-${c}">${UD.t('c_'+c)}</a>`).join('');
  $('#cards').innerHTML = CATS.map(c=>`<article class="mcard rv" id="cat-${c}"><div class="mphoto"><img loading="lazy" src="${CAT_IMG[c]}" alt=""><h3>${UD.t('c_'+c)}</h3></div><div class="mbody" data-key="${c}">${block(c)}</div></article>`).join('');
  UD.observe();
}
/* день, время и число гостей в заявке (время Фукуока, UTC+7) */
let bDay='', bTime='', guests=1;
function renderWhen(){
  const now=new Date(Date.now()+7*3600e3), nowMin=now.getUTCHours()*60+now.getUTCMinutes()+30, days=[];
  for(let i=(nowMin>22*60?1:0);i<7;i++){
    const d=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate()+i)), iso=d.toISOString().slice(0,10), o={weekday:'short',day:'numeric',month:'short',timeZone:'UTC'};
    let loc; try{ loc=d.toLocaleDateString(UD.lang,o); }catch(e){ loc=d.toLocaleDateString('en-GB',o); }
    days.push({iso, l:i===0?UD.t('w_today'):i===1?UD.t('w_tom'):loc, en:(i===0?'Today, ':i===1?'Tomorrow, ':'')+d.toLocaleDateString('en-GB',o), today:i===0});
  }
  let D=days.find(x=>x.iso===bDay); if(!D) bDay='';
  const times=[]; for(let m=8*60;m<=22*60;m+=30) if(!(D&&D.today)||m>=nowMin) times.push(String(m/60|0).padStart(2,'0')+':'+(m%60?'30':'00'));
  if(!times.includes(bTime)) bTime='';
  $('#cartWhen').innerHTML = `<select id="wDay" class="${bDay?'set':''}" aria-label="${UD.t('w_day')}"><option value="">📅 ${UD.t('w_day')}</option>${days.map(x=>`<option value="${x.iso}"${x.iso===bDay?' selected':''}>${x.l}</option>`).join('')}</select>`
    + `<select id="wTime" class="${bTime?'set':''}" aria-label="${UD.t('w_time')}"><option value="">🕐 ${UD.t('w_time')}</option>${times.map(x=>`<option${x===bTime?' selected':''}>${x}</option>`).join('')}</select>`
    + `<div class="gst" aria-label="${UD.t('w_guests')}"><button data-g="-1" aria-label="−">−</button><b>👤 ${guests}</b><button data-g="1" aria-label="+">+</button></div>`;
  return (D?D.en:'')+(bTime?(D?', ':'')+bTime:'');
}
document.addEventListener('change',(e)=>{ if(e.target.id==='wDay'){ bDay=e.target.value; renderCart(); } else if(e.target.id==='wTime'){ bTime=e.target.value; renderCart(); } });
function renderCart(){
  let sum=0, mins=0, plus=false, html='', msg="Hello! I'd like to book at Út Điệu Spa:\n";
  cart.forEach((v,k)=>{
    const [id,d]=k.split(':'), s=byId[id], p=priceOf(k);
    sum+=p; mins+=+d; if(s.max) plus=true;
    html+=`<div><span>${UD.pick(s.n)}${+d?` · ${d} ${UD.t('min')}`:''}</span><span>${UD.fmt(p)}${s.max?'+':''} <button data-rm="${k}" aria-label="remove">×</button></span></div>`;
    msg+=`• ${s.n[1]}${+d?` — ${d} min`:''} — ${UD.fmt(p)}${s.max?'+':''}\n`;
  });
  const H=UD.hotel;
  msg+=`Total: ${UD.fmt(sum)}${plus?'+':''}\n${H?`Pick-up from: ${UD.hotelText()} — is a transfer possible?\n`:''}Preferred day and time: ${renderWhen()}${guests>1?`\nGuests: ${guests}`:''}`;
  $('#cartPick').innerHTML = `<span>📍</span><b class="${H?'':'e'}">${H?UD.esc(H[0]):UD.t('pk_q')}</b>${H&&H[1]?`<i>${'★'.repeat(H[1])}</i>`:''}<u>›</u>`;
  document.body.classList.toggle('has-cart', cart.size>0);
  if(!cart.size) $('#cart').classList.remove('open');
  $('#cartList').innerHTML = html;
  $('#cartSum').innerHTML = `<small>${UD.t('cart_h')} · ${cart.size}${mins?` · ${mins} ${UD.t('min')}`:''} ▴</small><strong>${UD.fmt(sum)}${plus?'+':''}</strong>`;
  $('#cartGo').innerHTML = UD.WA_ICON+`<span>${UD.t('book')}</span>`;
  $('#cartGo').href = UD.wa(msg);
}
function renderAll(){ renderPanel(); renderQuiz(); renderSets(); renderMenu(); renderCart(); }
/* корзина изменилась не кликом по строке — перерисовать все списки */
function refresh(){ renderPanel(); document.querySelectorAll('.mbody').forEach(b=>b.innerHTML=block(b.dataset.key)); if(qa.length===3) renderQuiz(); renderSets(); renderCart(); }

document.addEventListener('click',(e)=>{
  const r=e.target.closest('.row[data-k]'), sg=e.target.closest('.seg button'), z=e.target.closest('[data-z]'), rm=e.target.closest('[data-rm]'), q=e.target.closest('[data-q]'), st=e.target.closest('[data-set]');
  if(r){ const k=r.dataset.k; cart.has(k)?cart.delete(k):cart.set(k,1);
    document.querySelectorAll(`.row[data-k="${k}"]`).forEach(c=>c.classList.toggle('on',cart.has(k))); renderSets(); renderCart(); }
  else if(sg){ const box=sg.closest('[data-key]'); dsel[box.dataset.key]=+sg.dataset.d; box.innerHTML=block(box.dataset.key); }
  else if(rm){ cart.delete(rm.dataset.rm); refresh(); }
  else if(q){ q.dataset.q==='reset' ? qa=[] : qa.push(q.dataset.q); renderQuiz(); }
  else if(st){ const S=SETS.find(x=>x.k===st.dataset.set), on=S.it.every(k=>cart.has(k)); S.it.forEach(k=>on?cart.delete(k):cart.set(k,1)); refresh(); }
  else if(z){ const v=z.dataset.z; zones.has(v)?zones.delete(v):zones.add(v); renderPanel(); }
  else if(e.target.closest('#cartSum')) $('#cart').classList.toggle('open');
  else if(e.target.closest('#cartPick')) UD.pickHotel(renderCart);
  else if(e.target.closest('[data-g]')){ guests=Math.min(8,Math.max(1,guests+ +e.target.closest('[data-g]').dataset.g)); renderCart(); }
  else if(e.target.closest('.gal img')){ const b=document.createElement('div'); b.className='lb'; b.innerHTML=`<img src="${e.target.src}" alt="">`; b.onclick=()=>b.remove(); document.body.appendChild(b); }
});
