<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Út Điệu Laundry — Phú Quốc</title>
<meta name="description" content="Laundry in Ông Lang, Phú Quốc — wash & dry, 30.000 ₫ per kg. Message us on WhatsApp.">
<meta name="theme-color" content="#eaf6fd">
<link rel="icon" href="../assets/img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#eaf6fd;--ink:#0b3552;--muted:#5d7f95;--acc:#0e8fd6;--acc-ink:#fff;--card:#fff;--line:rgba(11,53,82,.1);--hdr:rgba(234,246,253,.85);
--gate:linear-gradient(160deg,#39b4f0,#0b6fb0);--gate-ink:#fff;--gate-card:rgba(255,255,255,.18);
--fd:Nunito,system-ui,sans-serif;--fb:Nunito,system-ui,sans-serif}
h1,h2,h3{font-weight:900;letter-spacing:-.02em}
.gate-logo{background:#fff;display:grid;place-items:center;font-size:56px}
/* bubbles */
.bubbles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.bubbles i{position:absolute;bottom:-80px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.95),rgba(255,255,255,.15) 60%,rgba(14,143,214,.12));box-shadow:inset 0 0 0 1px rgba(255,255,255,.7);animation:float linear infinite}
@keyframes float{to{transform:translateY(-120svh) translateX(30px) rotate(40deg)}}
.hero{position:relative;min-height:100svh;display:flex;align-items:center;padding:90px 0 80px;background:linear-gradient(180deg,#cdeafb,#eaf6fd)}
.hero .w{position:relative;display:grid;gap:26px;align-items:center}
@media(min-width:820px){.hero .w{grid-template-columns:1.1fr .9fr}}
.hero h1{font-size:clamp(40px,10vw,76px);margin:12px 0 14px}
.hero h1 em{font-style:normal;color:var(--acc)}
.price{display:inline-flex;align-items:baseline;gap:8px;background:#fff;border-radius:22px;padding:12px 20px;margin:20px 0 22px;box-shadow:0 14px 34px -18px rgba(11,90,150,.5)}
.price b{font-size:38px;font-weight:900;color:var(--acc);line-height:1}
.price span{font-weight:800;color:var(--muted)}
.price small{display:block;font-size:12px;color:var(--muted)}
/* washing machine */
.wm{width:min(70vw,300px);margin:0 auto;filter:drop-shadow(0 30px 40px rgba(11,90,150,.25))}
.drum{transform-origin:150px 205px;animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.water{animation:slosh 2.4s ease-in-out infinite alternate;transform-origin:150px 205px}
@keyframes slosh{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
/* calc */
.calc{background:var(--card);border-radius:32px;padding:24px 20px;margin-top:26px;box-shadow:0 30px 60px -40px rgba(11,90,150,.5)}
.items{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.items button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 2px 8px;border-radius:18px;background:var(--bg);font-size:11px;font-weight:800;color:var(--muted);transition:transform .2s}
.items button:active{transform:scale(.9)}
.items span{font-size:30px;line-height:1.1}
.items em{position:absolute;top:-6px;right:-4px;min-width:22px;height:22px;border-radius:11px;background:var(--acc);color:#fff;font-style:normal;font-size:12px;display:grid;place-items:center;padding:0 5px;transform:scale(0);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.items em.on{transform:scale(1)}
.out{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:24px 0 8px}
.out .kg{font-size:20px;font-weight:800;color:var(--muted)}
.out .sum{text-align:right}
.out .sum b{display:block;font-size:clamp(34px,10vw,48px);font-weight:900;line-height:1}
.out .sum small{color:var(--muted);font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--acc) var(--f,20%),#d5ebf8 var(--f,20%));outline:0;margin:10px 0 20px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px var(--acc),0 8px 16px -4px rgba(11,90,150,.6);cursor:grab}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:4px solid var(--acc)}
.calc .btn{width:100%}
.reset{display:block;margin:14px auto 0;font-size:13px;font-weight:700;color:var(--muted);text-decoration:underline}
/* steps */
.steps{display:grid;gap:14px;margin-top:26px}
@media(min-width:760px){.steps{grid-template-columns:repeat(3,1fr)}}
.step{background:var(--card);border-radius:26px;padding:22px}
.step .n{width:44px;height:44px;border-radius:50%;background:var(--acc);color:#fff;font-weight:900;font-size:20px;display:grid;place-items:center;margin-bottom:12px}
.step b{font-size:19px;display:block;margin-bottom:4px}
.step p{color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:16px}
</style>
</head>

<section id="calc">

    <div class="kick rv" data-i18n="calc_k"></div>

<section style="padding-top:10px">

<section id="cross" style="padding-top:20px"></section>
<footer><div class="w"><b>Út Điệu Laundry</b><br><span data-i18n="foot_addr"></span><br><a href="tel:+84767907799">+84 76 790 7799</a></div></footer>

const $=(s)=>document.querySelector(s); const counts=ITEMS.map(()=>0);
function render(){
  const kg=+$('#rng').value, cost=kg*PRICE;
  $('#items').innerHTML=ITEMS.map((it,i)=>`<button data-i="${i}"><span>${it[0]}</span>${UD.t(it[2])}<em class="${counts[i]?'on':''}">${counts[i]}</em></button>`).join('');
  $('#kg').textContent=String(kg).replace('.',','); $('#sum').textContent=UD.fmt(cost); $('#sumA').textContent=UD.approx(cost);
  $('#heroApprox').textContent=UD.approx(PRICE);
  $('#rng').style.setProperty('--f',((kg-1)/14*100)+'%');
  $('#go').innerHTML=UD.WA_ICON+`<span>${UD.t('send')}</span>`;
  $('#go').href=UD.wa(`Hello! I'd like to use the laundry service (wash & dry).\nAbout ${kg} kg ≈ ${UD.fmt(cost)}.\nWhen can I bring it and when will it be ready?`);
}
$('#rng').addEventListener('input',render);
$('#items').addEventListener('click',(e)=>{ const b=e.target.closest('button'); if(!b) return; counts[+b.dataset.i]++;
  const w=counts.reduce((a,c,i)=>a+c*ITEMS[i][1],0); $('#rng').value=Math.min(15,Math.max(1,Math.ceil(w*2)/2)); render(); });
$('#reset').addEventListener('click',()=>{ counts.fill(0); $('#rng').value=3; render(); });
$('#bubbles').innerHTML=Array.from({length:14},(_,i)=>{const s=18+Math.random()*60;return `<i style="left:${Math.random()*100}%;width:${s}px;height:${s}px;animation-duration:${9+Math.random()*12}s;animation-delay:-${Math.random()*20}s"></i>`}).join('');
