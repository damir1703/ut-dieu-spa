.pin{cursor:pointer}

.pin.home circle:not(.halo){fill:#ffd08a}

const $=(s)=>document.querySelector(s); let cur='sao', days=2;
function render(){
  const p=PLACES.find(x=>x.id===cur), mx=(HOME[0]+p.x)/2+(p.y-HOME[1])*.18, my=(HOME[1]+p.y)/2-(p.x-HOME[0])*.18;
  $('#pins').innerHTML=`<g class="pin home"><circle cx="${HOME[0]}" cy="${HOME[1]}" r="7"/><text x="${HOME[0]-10}" y="${HOME[1]+4}" text-anchor="end" font-size="10" font-weight="800" fill="#ffd08a">Ông Lang</text></g>`+
    PLACES.map(q=>`<g class="pin${q.id===cur?' on':''}" data-p="${q.id}"><circle class="halo" cx="${q.x}" cy="${q.y}" r="9"/><circle cx="${q.x}" cy="${q.y}" r="6"/><circle cx="${q.x}" cy="${q.y}" r="16" style="fill:transparent;stroke:none"/></g>`).join('');
  $('#route').setAttribute('d',`M${HOME[0]} ${HOME[1]}Q${mx} ${my} ${p.x} ${p.y}`);
  $('#place').innerHTML=`<span class="km">${UD.t('km_from').replace('{km}',p.km)}</span><h3>${UD.pick(p.n)}</h3><p>${UD.pick(p.d)}</p>`;
  $('#pchips').innerHTML=PLACES.map(q=>`<button data-p="${q.id}" class="${q.id===cur?'on':''}">${UD.pick(q.n)}</button>`).join('');
  $('#n').textContent=days;
  const d=$('#date').value;
  $('#go').innerHTML=UD.WA_ICON+`<span>${UD.t('send')}</span>`;
  $('#go').href=UD.wa(`Hello! I'd like to rent a VinFast VF3 (self-drive).\nDays: ${days}\nStart date: ${d||'to be agreed'}\nI want to visit: ${p.en}\nWhat are the price and conditions?`);
}
document.addEventListener('click',(e)=>{ const p=e.target.closest('[data-p]'); if(p){cur=p.dataset.p;render();}
  if(e.target.id==='plus'){days=Math.min(30,days+1);render();} if(e.target.id==='minus'){days=Math.max(1,days-1);render();} });
$('#date').min=new Date().toISOString().slice(0,10); $('#date').addEventListener('change',render);
</script>
